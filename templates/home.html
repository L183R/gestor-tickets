{% extends "base.html" %}
{% block content %}
<h1 class="mb-4">Panel de Problemas Comunes</h1>
<div class="row g-4">
  {% for p in problems %}
  <div class="col-md-6 col-lg-3">
    <div class="card card-problem h-100 shadow-sm border-0">
      <div class="card-problem-media">
        <img src="{{ p.image }}" class="card-img-top" alt="{{ p.title }}">
      </div>
      <div class="card-problem-overlay">
        <h5 class="card-title mb-2">{{ p.title }}</h5>
        <p class="card-text text-secondary mb-0">{{ p.description }}</p>
      </div>
      <div class="card-problem-actions">
        <a href="{{ url_for('create_ticket', problem_id=p.id) }}" class="btn btn-create-ticket w-100">Crear ticket</a>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const pastelPalette = [
      "#fde2e4", "#fff1c1", "#e0f4ff", "#d8f3dc", "#ead7ff", "#ffe0b2", "#fce1ff", "#e7f5ff"
    ];

    document.querySelectorAll(".card-problem-overlay").forEach((overlay) => {
      const randomColor = pastelPalette[Math.floor(Math.random() * pastelPalette.length)];
      overlay.style.backgroundColor = randomColor;
    });
  });
</script>
{% endblock %}
