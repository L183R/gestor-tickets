{% extends "base.html" %}
{% block content %}
<span class="section-code">NUEVA MISIÓN // {{ problem.id|upper }}</span>
<h2>Nuevo ticket — {{ problem.title }}</h2>
<form method="post" class="card p-3 shadow-sm">
  <div class="mb-3">
    <label class="form-label">Nombre</label>
    <input name="requester_name" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Dependencia</label>
    <input name="department" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Teléfono / Interno</label>
    <input name="phone_internal" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Descripción del problema</label>
    <textarea name="description" rows="4" class="form-control" required></textarea>
  </div>
  <button class="btn btn-success">Registrar ticket</button>
</form>
{% endblock %}
